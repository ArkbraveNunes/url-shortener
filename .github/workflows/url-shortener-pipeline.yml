name: url-shortener CI-CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          npm install -g yarn
          npm install -g @nestjs/cli
          yarn

      - name: Audit dependencies
        run: |
          yarn audit --groups dependencies
          
      - name: Run tests
        run: |
          yarn lint

      - name: Run tests
        run: |
          yarn test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Upload report tests
        uses: actions/upload-artifact@v4
        with:
          name: tests-report
          path: reports/

      - name: Run build
        run: |
          yarn build

